<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Авторизация</title>
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <main class="login-layout login-page">
    <section class="ios-glass-panel">
      <div class="logo" aria-hidden="true"></div>
      <div class="logo-text">
        <h1>Brand New Notes</h1>
      </div>
      <h1 class="page-title">Авторизация</h1>
      <form class="login-form" data-form-type="login" novalidate>
        
        <label class="field" for="login-username">
          <span class="field-label">Логин</span>
          <input id="login-username" name="login" type="text"/>
          <small class="field-error" data-error-for="login"></small>
        </label>

        <label class="field" for="login-password">
          <span class="field-label">Пароль</span>
          <input id="login-password" name="password" type="password"/>
          <small class="field-error" data-error-for="password"></small>
        </label>

        <button type="submit" class="login-button">Войти</button>
        <p class="form-feedback"></p>
        <p class="hint">Нет аккаунта? <a href="./signup.html">Зарегистрироваться</a></p>
      </form>
    </section>
  </main>
</body>
</html>
